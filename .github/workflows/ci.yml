name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MOONBIT_VERSION: "0.1.20260713"

jobs:
  format-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (pinned version)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_VERSION=${{ env.MOONBIT_VERSION }} bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Fetch dependency registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache MoonBit installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
          key: moonbit-${{ env.MOONBIT_VERSION }}-${{ runner.os }}

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_VERSION=${{ env.MOONBIT_VERSION }} bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          $env:MOONBIT_VERSION = "${{ env.MOONBIT_VERSION }}"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME/.moon/bin"

      - name: MoonBit version
        run: moon version

      - name: Fetch dependency registry
        run: moon update

      - name: Type check (0 warnings required)
        run: moon check --deny-warn

      - name: Verify interface files are up-to-date
        run: |
          moon info
          git diff --exit-code -- '*.mbti' || (echo "::error::Interface files are out of date. Run 'moon info' and commit the changes." && exit 1)

      - name: Run tests
        run: moon test

      - name: Generate test coverage report
        if: runner.os == 'Linux'
        run: |
          moon test --cover 2>/dev/null || true
          if [ -f .coverage/*.json ]; then
            echo "Coverage data generated."
          else
            echo "::warning::Coverage data not available in this MoonBit version."
          fi

  benchmark:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Cache MoonBit installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
          key: moonbit-${{ env.MOONBIT_VERSION }}-ubuntu-22.04

      - name: Install MoonBit (pinned version)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_VERSION=${{ env.MOONBIT_VERSION }} bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Fetch dependency registry
        run: moon update

      - name: Type check
        run: moon check --deny-warn

      - name: Download baseline benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: baseline/

      - name: Run benchmarks
        run: |
          moon test 2>&1 | tee benchmark_output.txt

      - name: Regression detection (compare against baseline)
        run: |
          if [ ! -f baseline/benchmark_output.txt ]; then
            echo "::warning::No baseline benchmark found. This run establishes the baseline."
            exit 0
          fi
          # Parse benchmark lines (format: "name: X ms" or "name: X µs")
          # Extract benchmark name and numeric value, then compare.
          python3 - <<'PYEOF'
          import re, sys
          THRESHOLD = 0.25  # 25% slower than baseline triggers failure
          def parse(path):
              results = {}
              with open(path) as f:
                  for line in f:
                      m = re.match(r'^(.+?):\s+([\d.]+)\s+(ms|µs|us|s)\b', line.strip())
                      if m:
                          name = m.group(1).strip()
                          val = float(m.group(2))
                          unit = m.group(3)
                          # Normalize to milliseconds
                          if unit == 's':
                              val *= 1000
                          elif unit in ('µs', 'us'):
                              val /= 1000
                          results[name] = val
              return results
          baseline = parse('baseline/benchmark_output.txt')
          current = parse('benchmark_output.txt')
          regressions = []
          for name, cur_val in sorted(current.items()):
              if name in baseline:
                  base_val = baseline[name]
                  if base_val > 0:
                      ratio = (cur_val - base_val) / base_val
                      if ratio > THRESHOLD:
                          regressions.append(
                              f"  ❌ {name}: {cur_val:.3f}ms vs {base_val:.3f}ms ({ratio*100:.1f}% slower)"
                          )
                      elif ratio < -THRESHOLD:
                          print(f"  ✅ {name}: {cur_val:.3f}ms vs {base_val:.3f}ms ({abs(ratio)*100:.1f}% faster)")
          if regressions:
              print("Performance regressions detected (>25% slower than baseline):")
              for r in regressions:
                  print(r)
              sys.exit(1)
          else:
              print("No performance regressions detected (all within 25% of baseline).")
          PYEOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_output.txt

      - name: Update baseline (on main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmark_output.txt

  prove:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache MoonBit installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
          key: moonbit-${{ env.MOONBIT_VERSION }}-ubuntu-22.04

      - name: Install MoonBit (pinned version)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_VERSION=${{ env.MOONBIT_VERSION }} bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Fetch dependency registry
        run: moon update

      - name: Install Z3
        run: |
          pip3 install z3-solver==4.12.6.0
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Cache OPAM
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
          key: opam-why3-1.7.2

      - name: Install OCaml and Why3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opam libgmp-dev pkg-config
          opam init -y --disable-sandboxing --no-setup
          opam install -y why3.1.7.2
          echo "$HOME/.opam/default/bin" >> $GITHUB_PATH

      - name: Configure Why3
        run: why3 config detect

      - name: Run formal verification
        run: moon prove
