name: Release

on:
  push:
    tags:
      - "v*"

env:
  MOONBIT_VERSION: "0.1.20260713"

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache MoonBit installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
          key: moonbit-${{ env.MOONBIT_VERSION }}-ubuntu-22.04

      - name: Install MoonBit (pinned version)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_VERSION=${{ env.MOONBIT_VERSION }} bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: MoonBit version
        run: moon version

      - name: Type check (0 warnings required)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      - name: Run tests
        run: moon test

      - name: Install Z3
        run: |
          pip3 install z3-solver==4.12.6.0
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Cache OPAM
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
          key: opam-why3-1.7.2-release

      - name: Install OCaml and Why3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opam libgmp-dev pkg-config
          opam init -y --disable-sandboxing --no-setup
          opam install -y why3.1.7.2
          echo "$HOME/.opam/default/bin" >> $GITHUB_PATH

      - name: Configure Why3
        run: why3 config detect

      - name: Run formal verification
        run: moon prove

      - name: Publish to mooncakes.io
        env:
          MOON_CREDENTIALS: ${{ secrets.MOON_CREDENTIALS }}
        run: moon publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
