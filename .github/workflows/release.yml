name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Installs the latest MoonBit toolchain (dated versions are rotated off
# the CDN, so pinning is not viable).

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: MoonBit version
        run: moon version

      - name: Fetch dependency registry
        run: moon update

      - name: Type check (0 warnings required)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      - name: Run tests
        run: moon test

      - name: Install Z3
        run: |
          pip3 install z3-solver==4.12.6.0
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Cache OPAM
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
          key: opam-why3-1.7.2-release

      - name: Install OCaml and Why3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opam libgmp-dev pkg-config
          opam init -y --disable-sandboxing --no-setup
          opam install -y why3.1.7.2
          echo "$HOME/.opam/default/bin" >> $GITHUB_PATH

      - name: Configure Why3
        run: why3 config detect

      - name: Run formal verification
        run: moon prove

      - name: Publish to mooncakes.io
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOON_CREDENTIALS" | tr -d '[:space:]' | base64 -d > "$HOME/.moon/credentials.json"
          moon publish
        env:
          MOON_CREDENTIALS: ${{ secrets.MOON_CREDENTIALS }}

      - name: Generate source tarball and checksums
        run: |
          cd ..
          tar czf moon-certified-${{ github.ref_name }}.tar.gz moon-certified/
          sha256sum moon-certified-${{ github.ref_name }}.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt
          mv moon-certified-${{ github.ref_name }}.tar.gz checksums-sha256.txt moon-certified/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            checksums-sha256.txt
            moon-certified-${{ github.ref_name }}.tar.gz
